<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <div id="toptools" class="toptools">
      <button class="icon" id="back" title="Назад">‹</button>
      <button class="icon" id="fwd" title="Вперёд">›</button>
      <button class="icon" id="reload" title="Обновить">↻</button>
      <button class="icon" id="logbtn" title="Лог (Ctrl+Shift+L): скопировать для отчёта об ошибке">🐞</button>
    </div>
  </header>
  <div class="urlbar" id="urlbar"><input id="url" spellcheck="false" placeholder="Поиск или адрес"></div>
  <hr id="topsep">
  <section id="essentials" class="essentials"></section>
  <section id="pins" class="list"></section>
  <hr class="thin" id="pinsep">
  <button class="row newtab" id="newtab"><span class="plus">+</span><span>Новая вкладка</span></button>
  <section id="tabs" class="list scroll"></section>
  <footer class="spaces" id="spaces"></footer>
  <div id="menu" class="menu" hidden></div>
  <div id="logview" hidden>
    <div class="lv-bar">
      <b>Лог</b><span id="lv-info"></span><span class="lv-fill"></span>
      <button id="lv-refresh" title="Обновить">↻</button><button id="lv-copy">Копировать</button><button id="lv-dl">Скачать</button><button id="lv-clear">Очистить</button><button id="lv-close" title="Закрыть">✕</button>
    </div>
    <textarea id="lv-text" readonly spellcheck="false" wrap="off"></textarea>
  </div>
  <script src="log.js"></script>
  <script src="sidepanel.js"></script>
  <script src="logui.js"></script>
</body>
</html>
